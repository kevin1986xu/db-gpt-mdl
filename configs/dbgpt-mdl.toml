[system]
language = "zh"
log_level = "INFO"
api_keys = []
encrypt_key = "dbgpt-mdl-local-dev-key"

[service.web]
host = "127.0.0.1"
port = 18765
light = false
cors_allowed_origins = "${env:DBGPT_CORS_ALLOWED_ORIGINS:-*}"
model_storage = "memory"
disable_alembic_upgrade = false
new_web_ui = true
default_thread_pool_size = 8
remote_embedding = true
remote_rerank = true

[service.web.database]
type = "sqlite"
path = ".runtime/mdl/dbgpt.db"

[service.model.controller]
host = "127.0.0.1"
port = 18766

[models]
[[models.llms]]
name = "deepseek/deepseek-v4.1-flash"
backend = "deepseek-v4.1-flash"
provider = "proxy/openai"
api_base = "https://api.hzlinkapi.com/v1"
api_key = "${env:OPENAI_API_KEY:-}"

[app]
temperature = 0.1

